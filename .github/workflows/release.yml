name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub draft release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: true,
                generate_release_notes: false
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              core.info(`Release for ${tag} already exists.`);
            }

  release-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows worker binaries
        working-directory: worker
        run: |
          python -m PyInstaller --onefile --name worker worker.py
          python -m PyInstaller --onefile --name get_token get_token.py

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      - name: Build Windows release
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml

  release-macos:
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install macOS FFmpeg packages
        working-directory: desktop
        run: npm install --no-save ffmpeg-static @derhuerst/ffprobe-static

      - name: Stage macOS FFmpeg binaries
        working-directory: desktop
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../binaries/ffmpeg/macos-arm64

          FFMPEG_PATH="$(node -e "console.log(require('ffmpeg-static'))")"
          FFPROBE_PATH="$(node -e "console.log(require('@derhuerst/ffprobe-static'))")"

          test -f "$FFMPEG_PATH"
          test -f "$FFPROBE_PATH"

          cp "$FFMPEG_PATH" ../binaries/ffmpeg/macos-arm64/ffmpeg
          cp "$FFPROBE_PATH" ../binaries/ffmpeg/macos-arm64/ffprobe

          chmod +x ../binaries/ffmpeg/macos-arm64/ffmpeg
          chmod +x ../binaries/ffmpeg/macos-arm64/ffprobe

          file ../binaries/ffmpeg/macos-arm64/ffmpeg
          file ../binaries/ffmpeg/macos-arm64/ffprobe

          ../binaries/ffmpeg/macos-arm64/ffmpeg -version
          ../binaries/ffmpeg/macos-arm64/ffprobe -version

      - name: Install Python dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS worker binaries
        working-directory: worker
        run: |
          python -m PyInstaller --onefile --name worker worker.py
          python -m PyInstaller --onefile --name get_token get_token.py

          chmod +x dist/worker
          chmod +x dist/get_token

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      - name: Build macOS release
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify packaged macOS binaries
        working-directory: desktop
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find release -type d -name '*.app' | head -n 1)"

          test -n "$APP"
          test -d "$APP"

          FFMPEG="$APP/Contents/Resources/ffmpeg/ffmpeg"
          FFPROBE="$APP/Contents/Resources/ffmpeg/ffprobe"
          WORKER="$APP/Contents/Resources/worker/worker"
          GET_TOKEN="$APP/Contents/Resources/worker/get_token"

          test -x "$FFMPEG"
          test -x "$FFPROBE"
          test -x "$WORKER"
          test -x "$GET_TOKEN"

          file "$FFMPEG"
          file "$FFPROBE"
          file "$WORKER"
          file "$GET_TOKEN"

          "$FFMPEG" -version
          "$FFPROBE" -version

          "$FFMPEG" -hide_banner -encoders 2>/dev/null |
            grep h264_videotoolbox

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml

  publish-release:
    needs:
      - create-release
      - release-windows
      - release-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos

      - name: Show collected release files
        shell: bash
        run: |
          find artifacts -type f -maxdepth 3 -print

      - name: Upload files to GitHub Release
        shell: bash
        run: |
          set -euxo pipefail

          gh release upload "$GITHUB_REF_NAME" \
            artifacts/windows/* \
            artifacts/macos/* \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
