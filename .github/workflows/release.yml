name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub draft release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: true,
                generate_release_notes: false
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.info(`Release for ${tag} already exists.`);
            }

  release-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build worker.exe
        working-directory: worker
        run: python -m PyInstaller --onefile --name worker worker.py

      - name: Build get_token.exe
        working-directory: worker
        run: python -m PyInstaller --onefile --name get_token get_token.py

      - name: Build Electron app
        working-directory: desktop
        run: npm run build

      - name: Build Windows release
        working-directory: desktop
        run: npx electron-builder --win --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install macOS FFmpeg binaries
        working-directory: desktop
        run: npm install --no-save ffmpeg-static @derhuerst/ffprobe-static

      - name: Stage macOS FFmpeg binaries
        working-directory: desktop
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../binaries/ffmpeg/macos-arm64

          FFMPEG_PATH="$(node -e "console.log(require('ffmpeg-static'))")"
          FFPROBE_PATH="$(node -e "console.log(require('@derhuerst/ffprobe-static').path)")"

          cp "$FFMPEG_PATH" ../binaries/ffmpeg/macos-arm64/ffmpeg
          cp "$FFPROBE_PATH" ../binaries/ffmpeg/macos-arm64/ffprobe

          chmod +x ../binaries/ffmpeg/macos-arm64/ffmpeg
          chmod +x ../binaries/ffmpeg/macos-arm64/ffprobe

          file ../binaries/ffmpeg/macos-arm64/ffmpeg
          file ../binaries/ffmpeg/macos-arm64/ffprobe

          ../binaries/ffmpeg/macos-arm64/ffmpeg -version
          ../binaries/ffmpeg/macos-arm64/ffprobe -version

      - name: Install Python dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build worker binaries
        working-directory: worker
        run: |
          python -m PyInstaller --onefile --name worker worker.py
          python -m PyInstaller --onefile --name get_token get_token.py
          chmod +x dist/worker
          chmod +x dist/get_token

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      - name: Build macOS release
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged macOS binaries
        working-directory: desktop
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find release -type d -name '*.app' | head -n 1)"

          FFMPEG="$APP/Contents/Resources/ffmpeg/ffmpeg"
          FFPROBE="$APP/Contents/Resources/ffmpeg/ffprobe"

          test -x "$FFMPEG"
          test -x "$FFPROBE"

          file "$FFMPEG"
          file "$FFPROBE"

          "$FFMPEG" -version
          "$FFPROBE" -version
